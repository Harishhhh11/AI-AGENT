services:
  backend:
    build:
      context: ./backend
    container_name: ai-receptionist-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "true"
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://postgres:postgres@host.docker.internal:5433/ai_receptionist}
      # Inside Docker, Ollama is running on the Windows host.
      # Override both names so the canonical config URL is correct too.
      OLLAMA_BASE_URL: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - ai-receptionist

networks:
  ai-receptionist:
    driver: bridge
