        with:
          python-version: '3.12'

      - name: Install tool execution test dependencies
        run: pip install -r requirements.txt pytest-asyncio pgvector "pwdlib[argon2]" sentence-transformers

      - name: Run Phase 3 tool execution contracts
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
