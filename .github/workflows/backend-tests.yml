  phase6-production-hardening:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Phase 6 hardening test dependencies
        run: pip install -r requirements.txt pytest httpx pgvector email-validator "pwdlib[argon2]" sentence-transformers python-docx pypdf
      - name: Run Phase 6 production hardening contracts
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
          ENVIRONMENT: development
          DEBUG: 'false'
        run: pytest -q tests/test_phase6_production_hardening.py

  phase6-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deployment contract dependencies
        run: pip install pytest pyyaml
      - name: Run deployment contracts
        run: pytest -q backend/tests/test_phase6_deployment.py
      - name: Validate compose syntax
        run: python - <<'PY'
import yaml
from pathlib import Path
with Path('docker-compose.yml').open() as f:
    data = yaml.safe_load(f)
assert 'backend' in data['services']
PY

  phase6-security-ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: pip install pip-audit
      - name: Audit pinned/runtime dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Reject committed secret material
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'service-account*.json' \) -not -path './.git/*' | grep -q .; then
            echo 'Potential secret-bearing file committed to the repository.' >&2
            exit 1
          fi
          if git grep -nE '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- ':!*.md'; then
            echo 'Potential private key or cloud access key material found in tracked files.' >&2
            exit 1
          fi

  full-suite-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Install test dependencies
        run: pip install "psycopg[binary]" pgvector "pwdlib[argon2]" pytest-asyncio python-docx pypdf sentence-transformers email-validator
      - name: Run full regression suite
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q
