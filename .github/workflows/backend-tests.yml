name: Backend Tests

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase2-foundations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies needed by foundation tests
        run: pip install fastapi pydantic pydantic-settings sqlalchemy alembic python-dotenv pytest
      - name: Run Phase 2 foundation tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q tests/test_phase2_foundations.py

  chatservice-integration:
    runs-on: ubuntu-latest
