          python-version: '3.12'
      - name: Install integration-test dependencies
        run: pip install fastapi pydantic pydantic-settings sqlalchemy alembic python-dotenv pytest httpx pgvector sentence-transformers
      - name: Run ChatService integration tests
        env:
          PYTHONPATH: .
