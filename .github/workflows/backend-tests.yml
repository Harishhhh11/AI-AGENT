name: Backend Tests

on:
  push:
    branches:
      - main
      - 'phase-*'
      - 'feature/*'
      - 'fix/*'
      - 'agents/*'
      - 'upgrade/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Run unit tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio pgvector "pwdlib[argon2]" sentence-transformers
      - name: Run integration tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: >-
          pytest -q
          tests/test_chatservice_integration.py
          tests/test_integrations.py
          tests/test_phase5_channel_agent_integration.py
          tests/test_phase7_acceptance.py
          tests/test_knowledge_answer_service.py
          tests/test_chat_answer_contracts.py
          tests/test_retrieval_guard.py
          tests/test_conversation_subject_guard.py

  api-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx email-validator
      - name: Run API contract tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q tests/test_api_contracts.py tests/test_health.py tests/test_phase6_production_hardening.py

  tenant-isolation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio pgvector "pwdlib[argon2]" sentence-transformers
      - name: Run multi-tenant isolation tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q tests/test_tenant_isolation.py tests/test_repository_scoping.py tests/test_tenant_resolver.py tests/test_authorization.py

  frontend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  full-suite-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install "psycopg[binary]" pgvector "pwdlib[argon2]" pytest-asyncio python-docx pypdf sentence-transformers email-validator
      - name: Run full regression suite
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q

  security-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Reject committed secret material
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'service-account*.json' \) -not -path './.git/*' | grep -q .; then
            echo 'Potential secret-bearing file committed to repository.' >&2
            exit 1
          fi
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- ':!*.md'; then
            echo 'Potential private key or cloud access key material found.' >&2
            exit 1
          fi
