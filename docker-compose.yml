services:
  backend:
    build:
      context: ./backend
    container_name: ai-receptionist-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - ai-receptionist

networks:
  ai-receptionist:
    driver: bridge
